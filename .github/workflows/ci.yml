name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` must run before the typecheck: packages/extension/tsconfig.json
      # extends ./.wxt/tsconfig.json, which is generated by the `wxt prepare`
      # postinstall hook and is gitignored. Without it tsc cannot resolve its
      # base config.
      - name: Install
        run: npm ci

      - name: Assert wxt prepare generated its tsconfig
        run: test -f packages/extension/.wxt/tsconfig.json

      # Deliberately NOT `npm run build`: the `prebuild` hook fetches the ~25 MB
      # embedding model, and `wxt build` uses Vite, which transpiles without
      # typechecking — so a green build would not catch what this job catches.
      - name: Typecheck
        working-directory: packages/extension
        run: npx tsc --noEmit -p tsconfig.json

      # Run every suite even if an earlier one fails, so one red suite doesn't
      # mask the state of the others.
      - name: test:extract
        if: '!cancelled()'
        working-directory: packages/extension
        run: npm run test:extract

      - name: test:sync
        if: '!cancelled()'
        working-directory: packages/extension
        run: npm run test:sync

      - name: test:sidebar-helpers
        if: '!cancelled()'
        working-directory: packages/extension
        run: npm run test:sidebar-helpers

      - name: test:sidebar-renderers
        if: '!cancelled()'
        working-directory: packages/extension
        run: npm run test:sidebar-renderers

      - name: test:okf
        if: '!cancelled()'
        working-directory: packages/extension
        run: npm run test:okf
